name: Build and validate data

on:
  # Deliberately no `paths:` filter. An enumerated list rotted the moment lib/ and
  # test/ were added: a push touching only lib/disciplines.rb — the documented way to
  # retune the tagging threshold — ran neither the tests nor the stale-data.json check,
  # while deploy-pages.yml rebuilt and shipped it anyway. The job takes seconds, so
  # running it on a docs-only push is cheaper than maintaining the list.
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: .ruby-version
      - name: Run the unit tests
        run: rake test
      - name: Build data.json from the source CSV
        run: ruby bin/build_data
      - name: Validate data.json shape
        run: |
          ruby -rjson -e '
            d = JSON.parse(File.read("html/data.json"))
            header = ["Publisher","Journal Title","eISSN","eISSN Link","Discount or Waiver","Campuses Covered","Coverage Years","Link to Agreement Info","Disciplines"]
            raise "header mismatch" unless d["header"] == header
            raise "no rows" if d["data"].empty?
            d["data"].each_with_index { |r,i| raise "row #{i} wrong length" unless r.length == 9 }
            raise "no taxonomy" unless d.dig("taxonomy","tag_list")&.any?
            tagged = d["data"].count { |r| !r[8].empty? }
            raise "discipline coverage too low: #{tagged}/#{d["data"].length}" if tagged < d["data"].length * 0.98
            puts "OK: #{d["data"].length} rows, #{tagged} with disciplines, #{d["taxonomy"]["tag_list"].length} topics"
          '
      - name: Fail if data.json is out of date with the CSV
        run: git diff --exit-code html/data.json
